<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Setup Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
     <form id="customerForm" novalidate>
    <header>
      <h1>Customer Setup Form</h1>
    </header>
    <section id="country">
      <button class="accordion-headers">Country Section</button>
      <h2 class="section-header">Country</h2>
      <label>
        <h2>Country</h2>
        <select name="country">
          <option value = "United States">United States</option>
          <option value = "United States">United States</option>
          <option value = "United States">United States</option>
        </select>
      </label>
    <section id="contact-info">
      <button class="accordion-headers">Contact Info Section</button>
      <h2 class="section-header">Contact Info</h2>
       <label>
        <h2>Contact Info</h2>
         <input type="text" name="first_name" id="firstName"placeholder="First Name">
         <input type="text" name="last_name" id="lastName" placeholder="Last Name">
         <input type="text" name="email" id="email" placeholder="Email">
       </label>
    </section>
    <section>
      <button class="accordion-headers">Business Info Section</button>
      <h2>Business Info</h2>
      <h2 class="section-header">Business Info</h2>
       <label>
        <h2>Business Info</h2>
         <input type="text" name="first_name" id="businessFirstName" placeholder="First Name">
         <input type="text" name="last_name" id ="businessLastName" placeholder="Last Name">
         <input type="text" name="email" id="businessEmail" placeholder="Email">
       </label>
    </section>
     <button id="submission-button" type="submit">Submit</button>
  </form>
  <script src="main.js"></script>
</body>
</html>
